name: Build Phainon Android APK
on:
  push:
    branches: [phainon-android-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Phainon-Emberfall-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Phainon-Emberfall-Android
          path: Phainon-Emberfall-Android.apk
          if-no-files-found: error
